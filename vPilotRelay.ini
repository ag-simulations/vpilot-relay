; vPilot Relay settings — keep this file in vPilot\Plugins next to vPilotRelay.dll.

[Telegram]
; The bot token you got from @BotFather
BotToken=
; Leave empty, then message the bot while vPilot is running: it will tell you your Chat ID.
ChatId=

[Relay]
; Private messages (you can reply to them)
Private=true
; Text messages on frequency
Radio=true
; mentions = only messages containing your callsign, all = everything
RadioMode=mentions
Selcal=true
; Supervisor / server broadcast messages
Broadcast=true
; Connected / disconnected notifications
Connection=true
